name: Testnet Deployment

# Issue #1443 — Automated testnet deployment on push to main.
#
# Workflow:
#   1. Build contract WASM
#   2. Deploy to testnet using the alice identity (funded via Friendbot)
#   3. Save contract ID to workflow outputs
#   4. Build and deploy frontend to Vercel with updated CONTRACT_ID
#   5. Run smoke tests against the deployed frontend
#   6. Save deployment ID as artifact for rollback
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   STELLAR_ALICE_SECRET_KEY   — secret key for the alice testnet identity
#   VERCEL_TOKEN                — Vercel deployment token
#   VERCEL_ORG_ID               — Vercel team/org ID
#   VERCEL_PROJECT_ID           — Vercel project ID for the frontend
#   FRONTEND_SMOKE_URL          — (optional) base URL for smoke tests;
#                                 defaults to the Vercel deployment URL

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual runs for debugging

concurrency:
  group: testnet-deployment
  cancel-in-progress: false   # don't cancel mid-deploy

permissions:
  contents: read

env:
  STELLAR_NETWORK: testnet
  STELLAR_IDENTITY: alice
  CARGO_TERM_COLOR: always

jobs:
  deploy-testnet:
    name: Deploy contract & frontend to testnet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Install Rust + wasm target ──────────────────────────────────────
      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/subscription

      # ── 2. Build contract WASM ─────────────────────────────────────────────
      - name: Build contract WASM
        run: make build

      - name: Verify WASM artifact
        run: |
          WASM="contracts/target/wasm32-unknown-unknown/release/soroban_subscription_contract.wasm"
          if [ ! -f "$WASM" ]; then
            echo "::error::WASM artifact not found at $WASM"
            exit 1
          fi
          echo "WASM artifact size: $(du -h "$WASM" | cut -f1)"

      # ── 3. Install Stellar CLI ────────────────────────────────────────────
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      # ── 4. Configure alice identity & fund via Friendbot ──────────────────
      - name: Configure alice testnet identity
        run: |
          stellar keys import-secret-key alice \
            --secret-key "${{ secrets.STELLAR_ALICE_SECRET_KEY }}" \
            --network testnet

      - name: Fund alice via Friendbot (testnet)
        run: stellar keys fund alice --network testnet || true
        # `|| true` because the account may already be funded

      # ── 5. Deploy contract to testnet ─────────────────────────────────────
      - name: Deploy contract to testnet
        id: deploy
        run: |
          CONTRACT_ID=$(bash deploy/deploy.sh)
          if [ -z "$CONTRACT_ID" ]; then
            echo "::error::Deployment returned empty contract ID"
            exit 1
          fi
          echo "Contract deployed: $CONTRACT_ID"
          echo "contract-id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          # Also write to a file for artifact upload
          echo "$CONTRACT_ID" > contract-id.txt

      - name: Upload contract ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-contract-id
          path: contract-id.txt
          retention-days: 90

      # ── 6. Build frontend with updated CONTRACT_ID ────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Create .env.local with deployed contract ID
        run: |
          cat > frontend/.env.local <<'ENV'
          NEXT_PUBLIC_CONTRACT_ID=${{ steps.deploy.outputs.contract-id }}
          NEXT_PUBLIC_RPC_URL=https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE=Test SDF Network ; September 2015
          ENV

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: Test SDF Network ; September 2015

      # ── 7. Deploy frontend to Vercel ──────────────────────────────────────
      - name: Deploy frontend to Vercel
        id: vercel
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --org-id "${{ secrets.VERCEL_ORG_ID }}" \
            --project-id "${{ secrets.VERCEL_PROJECT_ID }}" \
            --cwd frontend \
            --yes 2>&1 | tee /dev/stderr | tail -1)
          echo "vercel-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Save deployment info artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment-info
          path: |
            contract-id.txt
          retention-days: 90

      # ── 8. Smoke tests against deployed frontend ──────────────────────────
      - name: Run smoke tests
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract-id }}
          FRONTEND_URL: ${{ steps.vercel.outputs.vercel-url }}
        run: |
          set -euo pipefail
          SMOKE_URL="${FRONTEND_URL}"
          if [ -z "$SMOKE_URL" ] && [ -n "${{ secrets.FRONTEND_SMOKE_URL }}" ]; then
            SMOKE_URL="${{ secrets.FRONTEND_SMOKE_URL }}"
          fi

          if [ -z "$SMOKE_URL" ]; then
            echo "::warning::No frontend URL available — skipping smoke tests"
            exit 0
          fi

          echo "Smoke testing frontend at: $SMOKE_URL"

          # 1. Verify the page loads and returns 200
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SMOKE_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Frontend returned HTTP $HTTP_STATUS (expected 200)"
            exit 1
          fi
          echo "✅ Frontend reachable (HTTP 200)"

          # 2. Verify contract ID is injected into the page
          PAGE_CONTENT=$(curl -s "$SMOKE_URL")
          if ! echo "$PAGE_CONTENT" | grep -q "$CONTRACT_ID"; then
            echo "::error::Contract ID not found in frontend page source"
            exit 1
          fi
          echo "✅ Contract ID present in frontend"

          # 3. Verify the contract exists on testnet via RPC
          CONTRACT_CHECK=$(stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source alice \
            --network testnet \
            --simulate-only \
            -- subscribe \
            --subscriber GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA \
            --merchant   GBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB \
            --token      CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC \
            --amount     1 \
            --interval   86400 2>&1 || true)
          echo "Contract simulation result: $CONTRACT_CHECK"
          # The simulation will fail with a validation error, but the contract
          # must be reachable — "not found" means deployment failed.
          if echo "$CONTRACT_CHECK" | grep -qi "not found\|contract not found"; then
            echo "::error::Contract not found on testnet"
            exit 1
          fi
          echo "✅ Contract reachable on testnet"

          echo ""
          echo "=== Smoke tests passed ==="
          echo "Contract ID: $CONTRACT_ID"
          echo "Frontend URL: $SMOKE_URL"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Testnet Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract ID | \`${{ steps.deploy.outputs.contract-id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend URL | ${{ steps.vercel.outputs.vercel-url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | testnet |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
