name: Disaster Recovery Exercise

on:
  schedule:
    # Weekly on Sunday at 04:00 UTC in a non-production environment
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      rto_target_ms:
        description: 'RTO objective in milliseconds'
        required: false
        default: '300000'

permissions:
  contents: read
  issues: write

jobs:
  dr-exercise:
    name: Non-Production DR Exercise
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: non-prod-dr
      DR_NON_PROD_CONFIRMED: 'true'
      DR_REPORT_DIR: reports
      DR_RTO_TARGET_MS: ${{ github.event.inputs.rto_target_ms || '300000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run non-production DR exercise
        id: dr_run
        continue-on-error: true
        run: node scripts/dr-exercise.mjs

      - name: Upload DR exercise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-exercise-report
          path: |
            reports/dr-exercise-report.md
            reports/dr-exercise-report.json
          retention-days: 90

      - name: Create follow-up issue on DR failure
        if: steps.dr_run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/dr-exercise-report.json';
            let title = `[DR Exercise] Recovery gap detected (${new Date().toISOString().slice(0, 10)})`;
            let body = 'The scheduled non-production DR exercise failed. See workflow logs and uploaded artifacts.';

            if (fs.existsSync(path)) {
              const report = JSON.parse(fs.readFileSync(path, 'utf8'));
              title = `[DR Exercise] Recovery gap detected in ${report.environment} (${report.completedAt.slice(0, 10)})`;
              const gaps = (report.gaps || []).map((g) => `- ${g}`).join('\n') || '- Unknown failure';
              body = [
                'A scheduled non-production disaster-recovery exercise detected a failure or RTO breach.',
                '',
                `- **Environment:** \`${report.environment}\``,
                `- **Total Elapsed:** ${report.totalElapsedMs} ms (RTO: ${report.objectives?.rtoTargetMs} ms)`,
                `- **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### Gaps',
                gaps,
                '',
                '### Next Steps',
                '- Investigate the failing or slow recovery phase in non-production.',
                '- Update runbooks or automation and re-run the DR exercise workflow.',
              ].join('\n');
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['disaster-recovery', 'ops'],
            });

      - name: Fail job if DR exercise failed
        if: steps.dr_run.outcome == 'failure'
        run: exit 1
