# NetworkPolicy for PostgreSQL.
#
# Ingress:  allow only from the three application pods (api, indexer, webhook-worker)
# Egress:   DNS only — PostgreSQL does not initiate outbound connections
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-network-policy
  namespace: sorobanpay
  labels:
    app.kubernetes.io/part-of: sorobanpay
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow connections from the API pod
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432

    # Allow connections from the Indexer pod
    - from:
        - podSelector:
            matchLabels:
              app: indexer
      ports:
        - protocol: TCP
          port: 5432

    # Allow connections from the Webhook Worker pod
    - from:
        - podSelector:
            matchLabels:
              app: webhook-worker
      ports:
        - protocol: TCP
          port: 5432

  egress:
    # Allow DNS resolution only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
