# Default deny-all ingress and egress for every pod in the sorobanpay namespace.
# All allowed communication is explicitly granted by the policies below.
# Requires a CNI that enforces NetworkPolicy (e.g. Calico, Cilium, or WeaveNet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sorobanpay
  labels:
    app.kubernetes.io/part-of: sorobanpay
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}          # applies to ALL pods in the namespace
  policyTypes:
    - Ingress
    - Egress
