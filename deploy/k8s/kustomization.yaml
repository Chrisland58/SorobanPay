apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sorobanpay

commonLabels:
  app.kubernetes.io/part-of: sorobanpay
  app.kubernetes.io/managed-by: kustomize

resources:
  # Default deny-all policy (must come first)
  - network-policy-default-deny.yaml

  # Per-workload network policies
  - network-policy-api.yaml
  - network-policy-indexer.yaml
  - network-policy-webhook-worker.yaml
  - network-policy-postgresql.yaml
